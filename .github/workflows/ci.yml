name: CI

on:
  # No branch filter. The previous one said `branches: [main]` while this repository's
  # branch is `master`, so the workflow had never run -- not once, on any push, and it
  # is registered as active so nothing looked wrong. A gate that has never executed is
  # worse than no gate: it reads as a passing check in the UI.
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The backends are separate crates in sibling directories; tiny-rca's
      # integration test drives the real binaries, so it needs release builds of
      # both. Checkout them alongside.
      # Checked out beside the crate rather than inside it, because Cargo.toml points at
      # `../tinylink` -- that is where it sits locally, and matching the local layout is
      # what lets the integration test drive the same binaries a developer does.
      #
      # actions/checkout refuses to write outside the workspace ("Repository path is not
      # under <workspace>"), so the siblings are linked rather than cloned. Without the
      # link the build stops with "no matching package named `tinylink` found".
      - name: Check out tiny-pdg-cs
        uses: actions/checkout@v4
        with:
          repository: steetstyle/tinypdg-cs
          path: tiny-pdg-cs

      - name: Check out tinylink
        uses: actions/checkout@v4
        with:
          repository: steetstyle/tinylink
          path: tinylink

      - name: Put the siblings where Cargo looks for them
        run: |
          ln -s "$GITHUB_WORKSPACE/tinylink" "$GITHUB_WORKSPACE/../tinylink"
          ln -s "$GITHUB_WORKSPACE/tiny-pdg-cs" "$GITHUB_WORKSPACE/../tiny-pdg-cs"
          ls -l "$GITHUB_WORKSPACE/../"

      - name: Build tiny-pdg-cs
        working-directory: tiny-pdg-cs
        run: cargo build --release --features mcp

      - name: Build tinylink
        working-directory: tinylink
        # mcp-http, not mcp: tests/http_test.rs drives `tinylink serve --http` as a
        # shared backend, and that transport is behind its own feature. With only
        # `mcp` the binary answers "serve --http requires the mcp-http feature" and the
        # test fails on a server that built fine.
        run: cargo build --release --features mcp-http

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
