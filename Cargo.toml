[package]
name = "tiny-rca"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Root-cause analysis for .NET microservices: bridges OpenTelemetry traces and logs to C# code through MCP"
readme = "README.md"
keywords = ["mcp", "opentelemetry", "root-cause-analysis", "observability", "dotnet"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[dependencies]
# Same version as tinylink and tiny-pdg-cs use, so one client drives all three.
rmcp = { version = "3", features = [
    "server",
    "client",
    "transport-io",
    "transport-child-process",
] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
pretty_assertions = "1"
# The integration test builds a real index for the tinylink backend it drives.
tinylink = { path = "../tinylink", default-features = false }

[[bin]]
name = "tiny-rca"
path = "src/main.rs"
